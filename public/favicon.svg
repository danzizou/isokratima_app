<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="32%" r="80%">
      <stop offset="0%" stop-color="#2a2018"/>
      <stop offset="60%" stop-color="#1a1410"/>
      <stop offset="100%" stop-color="#120d09"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8cf9a"/>
      <stop offset="100%" stop-color="#c79a4b"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Cross at the apex -->
  <g fill="url(#gold)">
    <rect x="246" y="96" width="20" height="92" rx="6"/>
    <rect x="222" y="124" width="68" height="20" rx="6"/>
  </g>
  <!-- Resonant ison arcs: the sustained drone radiating outward -->
  <g fill="none" stroke="url(#gold)" stroke-linecap="round">
    <path d="M150 300 a106 106 0 0 1 212 0" stroke-width="18" opacity="0.95"/>
    <path d="M120 330 a136 136 0 0 1 272 0" stroke-width="14" opacity="0.6"/>
    <path d="M92 360 a164 164 0 0 1 328 0" stroke-width="10" opacity="0.35"/>
  </g>
  <!-- The held note -->
  <circle cx="256" cy="300" r="22" fill="url(#gold)"/>
</svg>
